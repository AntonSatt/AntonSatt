name: GitHub Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate cards
        shell: bash
        run: |
          set -euo pipefail
          stats_url="https://github-readme-stats-cyan-five-25.vercel.app"

          download_card() {
            local url="$1"
            local destination="$2"
            local temporary="${destination}.tmp"

            curl --fail --show-error --silent --retry 3 \
              --retry-all-errors "$url" --output "$temporary"
            grep --quiet '<svg' "$temporary"
            mv "$temporary" "$destination"
          }

          mkdir -p profile
          download_card \
            "${stats_url}/api?username=AntonSatt&show_icons=true&theme=github_dark&hide_border=true" \
            profile/stats-dark.svg
          download_card \
            "${stats_url}/api/top-langs/?username=AntonSatt&layout=compact&theme=github_dark&hide_border=true" \
            profile/top-langs-dark.svg
          download_card \
            "${stats_url}/api?username=AntonSatt&show_icons=true&theme=default&hide_border=true" \
            profile/stats-light.svg
          download_card \
            "${stats_url}/api/top-langs/?username=AntonSatt&layout=compact&theme=default&hide_border=true" \
            profile/top-langs-light.svg

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "Uppdatera GitHub-statistiken"
          git push
